# Stavi u .github/workflows/update-data.yml
name: Update data.json

on:
  schedule:
    - cron: "0 6 * * *"   # svaki dan u 06:00 UTC
  workflow_dispatch:       # ručno pokretanje iz Actions taba

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install euroleague-api pandas requests
      - run: python build_data.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Update data.json" && git push)